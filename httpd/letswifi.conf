# Values in ${...} come from the container environment (custom.env) at httpd startup.
<IfModule !watchdog_module>
    LoadModule watchdog_module modules/mod_watchdog.so
</IfModule>
<IfModule !md_module>
    LoadModule md_module modules/mod_md.so
</IfModule>
<IfModule !authz_host_module>
    LoadModule authz_host_module modules/mod_authz_host.so
</IfModule>

ServerName ${LETSWIFI_HOSTNAME}

# ACME: any CA, configured in custom.env (tested with CERTInext via the InCommon Certificate Service)
MDCertificateAuthority   ${ACME_DIRECTORY_URL}
MDExternalAccountBinding ${ACME_EAB_KID} ${ACME_EAB_HMAC}
MDContactEmail           ${ACME_CONTACT_EMAIL}
MDCertificateAgreement   accepted
MDPrivateKeys            secp256r1
MDStoreDir               /opt/app-root/md
# Only host port 443 is published (to container port 8443); nothing listens on host port 80.
# No HTTP-01: the CA must either pre-validate the domain (as CERTInext does once DCV for the
# parent domain is complete) or validate each order with tls-alpn-01 on 443 (below).
MDPortMap                http:- https:8443
# acme-tls/1 enables tls-alpn-01. A CA that pre-validates the domain never uses it, but keep it:
# mod_md refuses to order at all (AH10173) unless one challenge type is available.
Protocols                http/1.1 acme-tls/1
# Sends HSTS on HTTPS responses
MDRequireHttps           permanent
MDomain                  ${LETSWIFI_HOSTNAME}

<VirtualHost *:8443>
    ServerName ${LETSWIFI_HOSTNAME}
    SSLEngine  on
    # No SSLCertificateFile: mod_md supplies the certificate

    DocumentRoot /opt/app-root/letswifi/htdocs
    Alias /simplesaml /opt/app-root/letswifi/simplesamlphp/public
    # Institution picker in the portal's look (replaces SimpleSAMLphp's discovery page)
    Alias /discovery/ /opt/app-root/eso-letswifi/discovery/

    # Headers from letswifi's INSTALL.md example vhost
    Header always set Content-Security-Policy "default-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none';"
    Header always set Referrer-Policy        "no-referrer"
    Header always set X-Frame-Options        "DENY"
    Header always set X-Content-Type-Options "nosniff"

    <Directory /opt/app-root/letswifi/htdocs>
        Options None
        AllowOverride None
        Require all granted
        # Pass the Authorization header to PHP; the geteduroam apps call the API with OAuth Bearer tokens
        CGIPassAuth On
    </Directory>
    <Directory /opt/app-root/letswifi/simplesamlphp/public>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /opt/app-root/eso-letswifi/discovery>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Per-realm revocation deny-lists, written on the host by revocations/export-revocations.py
    # and pulled by the FreeRADIUS hosts listed in LETSWIFI_REVOCATION_CLIENTS
    Alias /revocations/ /opt/app-root/revocations/
    <Directory /opt/app-root/revocations>
        Options None
        AllowOverride None
        Require ip ${LETSWIFI_REVOCATION_CLIENTS}
        # Serve <realm>.sqlite only; never lock or temp files
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
        ForceType application/vnd.sqlite3
        Header always set Cache-Control "no-cache"
    </Directory>
</VirtualHost>
